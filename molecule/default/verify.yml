---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Stat root mysql client config
      ansible.builtin.stat:
        path: /root/.my.cnf
      register: root_my_cnf

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Set expected MySQL service name for host
      ansible.builtin.set_fact:
        mysql_expected_service: >-
          {{
            (mysql_service_name_debian | default('mysql'))
            if ansible_facts['os_family'] | lower == 'debian'
            else (mysql_service_name_redhat | default('mysqld'))
          }}.service

    - name: Resolve config file path for host
      ansible.builtin.set_fact:
        mysql_expected_config: >-
          {{
            (mysql_config_file_debian | default('/etc/mysql/mysql.conf.d/mysqld.cnf'))
            if ansible_facts['os_family'] | lower == 'debian'
            else (mysql_config_file_redhat | default('/etc/my.cnf'))
          }}

    - name: Stat config file
      ansible.builtin.stat:
        path: "{{ mysql_expected_config }}"
      register: mysql_config_file_stat

    - name: Read config file when present
      ansible.builtin.slurp:
        src: "{{ mysql_expected_config }}"
      register: mysql_config
      when: mysql_config_file_stat.stat.exists

    - name: Assert root client config and running service
      ansible.builtin.assert:
        that:
          - root_my_cnf.stat.exists
          - root_my_cnf.stat.mode == "0600"
          - mysql_expected_service in ansible_facts.services
          - ansible_facts.services[mysql_expected_service].state == "running"

    - name: Assert bind-address was configured for remote access
      ansible.builtin.assert:
        that:
          - "'bind-address = 0.0.0.0' in (mysql_config.content | b64decode)"
      when: mysql_config_file_stat.stat.exists

    - name: Query the remote account exists
      # Socket path hardcoded — the role's *_socket_* defaults are not loaded
      # in this standalone verify play. Both MySQL and MariaDB use this path
      # on Debian/Ubuntu.
      ansible.mysql.mysql_query:
        login_unix_socket: /run/mysqld/mysqld.sock
        query: "SELECT User FROM mysql.user WHERE User = 'molecule'"
      register: mysql_remote_check

    - name: Assert remote account was created
      ansible.builtin.assert:
        that:
          - mysql_remote_check.rowcount[0] | int >= 1
        fail_msg: "Remote user 'molecule' was not created"

    # --- AN-44: databases and users actually exist and can connect ---
    - name: List databases
      ansible.builtin.command: mysql -N -B -e "SHOW DATABASES;"
      register: mysql_verify_dbs
      changed_when: false

    - name: Assert both application databases were created
      ansible.builtin.assert:
        that:
          - "'molecule_app' in mysql_verify_dbs.stdout_lines"
          - "'molecule_legacy' in mysql_verify_dbs.stdout_lines"
        quiet: true

    - name: Read the users and their auth plugins
      ansible.builtin.command: >-
        mysql -N -B -e "SELECT CONCAT(user,'@',host,':',plugin) FROM mysql.user
        WHERE user IN ('molecule_app','molecule_legacy');"
      register: mysql_verify_users
      changed_when: false

    - name: Assert users exist on localhost with the requested plugin
      # The plugin assertion is the point: a user created with the server
      # default authenticates fine from the mysql CLI and fails from an old
      # client, which is exactly how a "healthy" server serves a broken app.
      ansible.builtin.assert:
        that:
          - "'molecule_app@localhost:' in mysql_verify_users.stdout"
          - "'molecule_legacy@localhost:mysql_native_password' in mysql_verify_users.stdout"
        fail_msg: "users/plugins wrong: {{ mysql_verify_users.stdout }}"
        quiet: true

    - name: Prove the app user can actually connect and use its database
      # Creating a user and granting on a database are separate things; only a
      # real connection proves the grant landed.
      ansible.builtin.command: >-
        mysql -u molecule_app -pmolecule-app-pw molecule_app -N -B -e "SELECT 1;"
      register: mysql_verify_conn
      changed_when: false
      no_log: true

    - name: Assert the connection succeeded
      ansible.builtin.assert:
        that:
          - mysql_verify_conn.rc == 0
        quiet: true
